set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on

# enable focus events for vim autoread
set -g focus-events on

# prefix
set -g prefix C-M-Space
unbind C-b
bind C-M-Space send-prefix

# status bar
set -g status on
set -g status-interval 1

set -g status-style "fg=#c0c0c0"

# change history limit
set -g history-limit 50000

# vim-style pane navigation
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# vim-style pane resizing
bind -n -r M-H resize-pane -L 5
bind -n -r M-J resize-pane -D 5
bind -n -r M-K resize-pane -U 5
bind -n -r M-L resize-pane -R 5

# reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# left side
set -g status-left-length 50
set -g status-left "#[fg=#808080]#S "

# right side
set -g status-right-length 100
set -g status-right "#[fg=#5a5a5a]#H "

# windows
set -g window-status-format "#[fg=#808080] #I:#W "
set -g window-status-current-format "#[fg=#ffffff] #I:#W "

# borders
set -g pane-border-style "fg=#404040"
set -g pane-active-border-style "fg=#c0c0c0"

# message
set -g message-style "bg=#111111 fg=#c0c0c0"

# scroll mode with prefix + [
bind [ copy-mode

# vi in copy mode
set -g mode-keys vi
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi MouseDragEnd1Pane \
    send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# scroll with mouse wheel
bind -T copy-mode-vi WheelUpPane send -X scroll-up
bind -T copy-mode-vi WheelDownPane send -X scroll-down

# selection similar to vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# exit with ESC
bind -T copy-mode-vi Escape send -X cancel

# ui
set -g status-position bottom
set -g status-justify left

# remove sound
set -g bell-action none

# reduce delay
set -sg escape-time 0
