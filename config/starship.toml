add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$golang\
$nodejs\
$php\
$python\
$ruby\
$rust\
$java\
$lua\
$docker_context\
$cmd_duration\
$line_break\
$character
"""

palette = "mono"

[palettes.mono]
fg = "#c0c0c0"
fg_dim = "#808080"
fg_soft = "#5a5a5a"
bg = "#000000"

# DIRECTORY
[directory]
style = "fg"
format = "[$path]($style) "
home_symbol = "~"
truncation_length = 2
truncate_to_repo = true

# GIT
[git_branch]
symbol = " "
style = "fg_dim"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg_soft"
format = "[$all_status$ahead_behind]($style) "

# LANGUAGES

[c]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[cpp]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[golang]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[nodejs]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[php]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[python]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[ruby]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[rust]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[java]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[lua]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[docker_context]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

# COMMAND TIME
[cmd_duration]
min_time = 500
style = "fg_soft"
format = "[($duration)]($style) "

# PROMPT
[character]
success_symbol = "[›](fg)"
error_symbol = "[›](fg)"
vicmd_symbol = "[‹](fg_dim)"
