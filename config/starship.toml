add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$crystal\
$dart\
$elixir\
$erlang\
$gleam\
$golang\
$haskell\
$java\
$julia\
$kotlin\
$lua\
$nim\
$nodejs\
$ocaml\
$perl\
$php\
$python\
$raku\
$ruby\
$rust\
$scala\
$swift\
$terraform\
$typst\
$vlang\
$zig\
$nix_shell\
$docker_context\
$cmd_duration\
$line_break\
$character
"""

palette = "mono"

[palettes.mono]
fg = "#c0c0c0"
fg_dim = "#808080"
fg_soft = "#5a5a5a"
bg = "#000000"

# DIRECTORY
[directory]
style = "fg"
format = "[$path]($style) "
home_symbol = "~"
truncation_length = 2
truncate_to_repo = true

# GIT
[git_branch]
symbol = " "
style = "fg_dim"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg_soft"
format = "[$all_status$ahead_behind]($style) "

# LANGUAGES

[c]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[cpp]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[crystal]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[dart]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[elixir]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[erlang]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[gleam]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[golang]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[haskell]
symbol = "󰲒"
style = "fg_soft"
format = "[$symbol]($style) "

[java]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[julia]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[kotlin]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[lua]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[nim]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[nodejs]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[ocaml]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[perl]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[php]
symbol = ""
style = "fg_soft"
format = "[$symbol]($style) "

[python]
